<button
  type="button"
  class="tile"
  role="radio"
  [attr.aria-checked]="selected()"
  [class.selected]="selected()"
  (click)="picked.emit()"
>
  <app-workout-art [kind]="art()" />
  <span class="shade"></span>
  @if (chip(); as chip) {
    <span class="chip">{{ chip }}</span>
  }
  <span class="info">
    <strong>{{ title() }}</strong>
    @if (subtitle(); as subtitle) {
      <span class="benefit">{{ subtitle }}</span>
    }
    @if (meta(); as meta) {
      <small>{{ meta }}</small>
    }
  </span>
</button>
