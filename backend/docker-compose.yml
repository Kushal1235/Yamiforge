services:
  postgres:
    image: postgres:16-alpine
    container_name: yamiforge-postgres
    environment:
      POSTGRES_DB: yamiforge
      POSTGRES_USER: yamiforge
      POSTGRES_PASSWORD: yamiforge
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U yamiforge -d yamiforge']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
