spring.application.name=yamiforge-api

# Local defaults match backend/docker-compose.yml (host port 5433, so it can sit beside another Postgres on 5432); override with env vars elsewhere.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/yamiforge}
spring.datasource.username=${DATABASE_USERNAME:yamiforge}
spring.datasource.password=${DATABASE_PASSWORD:yamiforge}

# Flyway owns the schema; Hibernate only checks that entities line up with it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.port=${PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=14d

# There is no email/SMS provider yet, so codes are written to the server log.
# Turn this off once a real OtpSender exists.
yamiforge.otp.log-codes=${OTP_LOG_CODES:true}
yamiforge.otp.ttl-minutes=5
yamiforge.otp.max-attempts=5

# Never put stack traces or validation internals in error responses (devtools would otherwise add them).
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
